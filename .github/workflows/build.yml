name: Duet Build
on:
  push:
    branches: ["main"]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm run validate
      - run: npm test
      - run: npm run build
      - run: npm run build:itch
      - uses: actions/upload-artifact@v4
        with:
          name: veiled-dominion-duet-itch
          path: artifacts/veiled-dominion-duet-itch.zip
